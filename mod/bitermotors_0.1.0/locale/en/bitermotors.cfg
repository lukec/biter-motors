[technology-description]
foundry=Requires proven Energy Products manufacturing, then invests 250 cycles of red, green, blue science, and Dollars. Each Foundry draws 2.5 MW before modules; a basic melting and casting pair draws 5 MW.
bitermotors-industrial-supply-chain=Establishes terrestrial heavy industry before oil processing. Unlocks an electronic-circuit Electric Furnace and leads to Big Mining Drills and recycling. Foundries arrive later after Energy Products.
bitermotors-sales-office=Unlocks the Sales Office, EV Charging Stations, and the first sales recipe: sell hopes and dreams. Place a powered charger near biter customers to unlock Prototype Roadsters.
bitermotors-premium-ev-program=Invests 250 cycles of red, green, blue science, and Dollars into drivetrains and a commodity-battery Premium EV pilot. Production also requires 50 completed Prototype Roadster sales.
bitermotors-advanced-battery-chemistry=After total Premium EV output reaches 250 at Gigafactory scale and exposes the old supply chain's limits, invest 300 cycles through chemical science plus Dollars to unlock nickel and lithium extraction, high-nickel cells, structural packs, and scalable Premium EV production.
bitermotors-ev-charging-network=Invests 150 cycles of red, green, blue science, and Dollars to unlock the eight-stall V2 charging network.
bitermotors-capital-scaling=Invests 600 cycles of red, green, blue, purple, yellow science, and Dollars into Gigacasting, Gigafactory V2, and V3 charging. Mass-market EVs require 250 Premium EV sales.
bitermotors-megatruck-engineering=Applies Tank engineering to a brutally fast, long-range electric truck. Production also requires 2,000 completed Mass-market EV sales.
bitermotors-energy-products=Invests 200 cycles through chemical science plus Dollars after Advanced Battery Chemistry, adding LFP cells and packs for upgradeable High-density Solar Panels and Megapacks before factory-scale power demand arrives.
bitermotors-terrestrial-ai=Unlocks Datacenter Racks, Autonomy Computers, and the Terrestrial Datacenter. Each cycle consumes 20 Dollars, draws 8 MW, and produces 20 AI Tokens every 30 seconds; stockpile 1,000 Tokens for Autonomous Logistics.
bitermotors-orbital-compute=Keeps vanilla rockets and platforms, then unlocks physical Orbital Datacenter Cores, Radiator Panels, and 50 MW Space Solar Panels. A cooled 250 MW core consumes 1 Dollar and produces 10,000 physical AI Tokens every 30 seconds; cargo pods must return them to Nauvis.
bitermotors-orbital-cluster-training=Available after one million cumulative orbital AI Tokens. Invest 5,000 Dollars plus science to raise each one-Dollar orbital batch from 10,000 to 25,000 Tokens.
bitermotors-grid-scale-energy=Available after ten million cumulative orbital AI Tokens. Invest 15,000 Dollars plus science to unlock 50,000-token orbital batches, 3 MW Tandem Solar Arrays, and 1 GJ Grid Megapacks.
bitermotors-hyperscale-training=Available after 100 million cumulative orbital AI Tokens. Invest 30,000 Dollars plus science to unlock 100,000-token orbital batches and the final Planetary Energy Grid research.
bitermotors-autonomous-logistics=Unlocks V4 Superchargers, the Robotaxi Service Center, and physical Navigate and Summon controls for Biter Motors EVs except the Prototype Roadster. Robotaxi production additionally requires 5,000 total Roadster, Premium, Mass-market, and Megatruck sales.
bitermotors-planetary-energy-grid=Invests 2,500 cycles of all pre-Promethium science plus AI Tokens in the 10 GW facility needed to train AGI.
bitermotors-supercharging-power-electronics=Higher-power charging electronics move more energy into player EVs while drawing proportionally more grid power.
bitermotors-long-range-battery=Improved battery management extends driving range and lets each customer charging stall support more EV owners.
bitermotors-premium-audio-systems=Biters love Nickelback.
bitermotors-customer-referral-program=Happy EV owners attract new customer settlements faster.
bitermotors-high-density-solar-productivity=Improved panel integration produces more High-density Solar Panels from the same panels, electronics, structure, and capital.
bitermotors-megapack-productivity=Improved pack assembly produces more Biter Motors Megapacks from the same accumulators, electronics, structure, and capital.
bitermotors-battery-material-recovery=Separates battery chemistries and recovers 36 active cells from every ten damaged packs: exactly 90%, with no free electronics or pack hardware.
bitermotors-cybertrain-logistics=Unlocks the Cybertrain: an obscenely fast 6 MW electric locomotive whose heavy acceleration consumes real onboard energy, whose braking regenerates charge, and whose battery recharges only at powered Cybertrain charging stops.

[technology-effect-description]
bitermotors-supercharging-power-electronics=Player EV charging rate and charging power draw: +10% per level
bitermotors-long-range-battery=Driving energy use: -8% and customer EV capacity: +5% per level
bitermotors-premium-audio-systems=Consumer EV sale speed and Robotaxi revenue: +5% per level
bitermotors-customer-referral-program=Customer settlement growth: +10% per level
bitermotors-high-density-solar-productivity=High-density Solar Panel recipe productivity: +10% per level
bitermotors-megapack-productivity=Megapack recipe productivity: +10% per level
