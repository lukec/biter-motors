[item-description]
bitermotors-ev-autopilot-destination=Select a destination for the occupied Biter Motors EV. Manual driving cancels navigation.
bitermotors-dollar=Roughly US$10,000 of investable capital in current-dollar terms. Produced by sales and spent on research, factories, energy, rockets, and compute.
bitermotors-ev-reservation=Persistent buyer paperwork. Each covered unsold prospect files another reservation every five minutes until purchasing; consumer EV sales consume one.
bitermotors-wrecked-ev=A damaged customer vehicle. Producing the first wreck makes Recycling research available; complete it to recover steel, electronics, and battery hardware.
bitermotors-damaged-high-energy-battery-pack=High-nickel pack scrap. Battery Material Recovery returns exactly 90% of its active cells in ten-pack batches.
bitermotors-damaged-lfp-battery-pack=LFP pack scrap. Battery Material Recovery returns exactly 90% of its active cells in ten-pack batches.
bitermotors-electric-drive-charge=Internal energy drawn automatically from the vehicle battery. Recharge the battery by parking near a powered Biter Motors charger; no manually inserted fuel is required.
bitermotors-gigafactory-module=One repeatable production cell containing capital, assemblers, labs, line logistics, and reinforced factory floor. Ten modules form one Gigafactory.
bitermotors-gigacast=Factory-scale casting machinery that replaces many separate body parts with a single large casting.
bitermotors-gigafactory-v2=A fast-replaceable Gigafactory upgrade built from one Gigafactory item, one Gigacast, and Dollars. It crafts twice as fast with 150% built-in productivity and substantially less energy per vehicle.
bitermotors-high-density-solar-array=Upgrades one conventional panel with advanced electronics and structure to produce 300 kW from the same 3x3 footprint. Stack size 10.
bitermotors-tandem-solar-array=Upgrades one High-density Solar Panel to 3 MW peak output in the same footprint. Unlocked at ten million cumulative orbital AI Tokens.
bitermotors-megapack=A factory-scale 100 MJ battery with 5 MW charge and discharge capacity.
bitermotors-grid-megapack=A 1 GJ, 50 MW direct upgrade for the Megapack. Unlocked with Grid-scale Energy.
bitermotors-ai-token=Physicalized compute output from terrestrial or orbital AI. Space compute scales the token stream; the planet decides how to use it.
bitermotors-agi-training-dataset=50,000 AI Tokens packaged as one physical input for the final training run.
bitermotors-capital-allocation=500 Dollars committed as one physical input for the final training run.
bitermotors-agi-model=The tangible result of the final training run. Producing it wins Biter Motors.
bitermotors-prototype-roadster=Builds in 30 seconds and begins with a full battery. Drive it directly or sell one with an EV Reservation in 60 seconds for 2 Dollars of profit. Park within 8 tiles of a powered Biter Motors charger to recharge. Sell 50 to unlock Premium EV production.
bitermotors-premium-ev=The 30-second pilot recipe uses 48 conventional Batteries. Advanced Battery Chemistry unlocks a 20-second high-energy-pack recipe. Sell one with an EV Reservation in 30 seconds for 1 Dollar of profit.
bitermotors-mass-market-ev=Builds in 8 seconds. Sell one with an EV Reservation in 5 seconds for 1 Dollar of profit.
bitermotors-megatruck=Builds in 15 seconds. Sell one with an EV Reservation in 10 seconds for 2 Dollars of profit.
bitermotors-robotaxi-fleet=Builds in 20 seconds. Stack size 5. Each deployed Robotaxi can serve five nearby biter customers.
bitermotors-robotaxi-service-center=Stores up to 200 Robotaxis across 40 fleet slots and converts allocated fleet utilization into recurring profit.
bitermotors-cybertrain=An extreme-speed terrestrial freight locomotive with a finite 1 GJ battery, 6 MW traction, mass-sensitive acceleration demand, 65% regenerative braking, station-only charging, and a slow emergency reserve below 1% charge.
bitermotors-cybertrain-charging-stop=An electrified train stop that charges stopped Cybertrains from the local grid at up to 50 MW.

