[recipe-description]
bitermotors-sell-megapack=A physical energy believer travels up to 384 tiles to buy one Megapack for 20 Dollars of profit, then carries it home. Referrals expand settlement adoption over time.
bitermotors-dirty-nickel-refining=Legacy process: produces 4 Nickel Sulfate, 1 Cobalt Concentrate, and 200 Acidic Tailings per batch.
bitermotors-lithium-extraction=Legacy process: produces 4 Lithium Carbonate and 100 Acidic Tailings per batch.
bitermotors-phosphate-extraction=Legacy process: produces 4 Phosphate and 100 Acidic Tailings per batch.
bitermotors-clean-nickel-refining=Improved process: produces 5 Nickel Sulfate and only 50 Acidic Tailings per batch. Pair it with Dry-electrode high-nickel cells in a Gigafactory; legacy cell recipes still require cobalt from Dirty nickel refining.
bitermotors-clean-lithium-extraction=Improved process: produces 5 Lithium Carbonate and only 25 Acidic Tailings per batch.
bitermotors-clean-phosphate-extraction=Improved process: produces 5 Phosphate and only 25 Acidic Tailings per batch.
bitermotors-dry-high-nickel-cell=Clean-route Gigafactory process: produces 6 High-nickel Cells without Cobalt Concentrate. Pair it with Clean nickel refining.
bitermotors-dry-lfp-cell=Clean-route Gigafactory process: produces 6 LFP Cells in four seconds.
bitermotors-high-nickel-cell=Chemical Plant route. Consumes the Cobalt Concentrate from dirty nickel refining; one four-cell batch fills one High-energy Battery Pack.
bitermotors-cell-scale-high-nickel=Gigafactory-only route. Consumes the same dirty-refining precursors and cobalt while producing five cells instead of four.
bitermotors-lfp-cell=Chemical Plant route. One four-cell batch fills one LFP Battery Pack.
bitermotors-cell-scale-lfp=Gigafactory-only route. Produces five LFP cells from the same inputs used by the four-cell Chemical Plant route.

