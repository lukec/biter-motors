[entity-description]
bitermotors-sales-office=Converts physical products into dollars. Belt cars in, belt money out.
bitermotors-ev-charging-station=A four-stall charger serving 12 EVs per stall, or 48 EVs total. Active stalls draw 50 kW; covered prospects periodically file EV Reservations.
bitermotors-ev-charging-station-v2=An eight-stall hub serving 20 EVs per stall, or 160 EVs total. Each active stall draws 150 kW, for 1.2 MW maximum demand.
bitermotors-ev-charging-station-v3=A 12-stall Supercharger serving 32 EVs per stall, or 384 EVs total. Each active stall draws 250 kW, for 3 MW maximum demand.
bitermotors-ev-charging-station-v4=A solar-canopy, 20-stall Supercharger serving 50 EVs per stall, or 1,000 EVs total. Each active stall draws 500 kW, for 10 MW maximum demand.
bitermotors-gigafactory-building=A vast 20 MW vehicle factory with 4x crafting speed, 50% built-in productivity, and eight module slots. Every two Premium EV input sets produce three vehicles.
bitermotors-gigafactory-v2=A 30 MW upgrade with 8x crafting speed and 150% built-in productivity. It doubles V1 throughput while using less energy per unit of crafting speed.
bitermotors-high-density-solar-array=A 300 kW direct upgrade for a conventional solar panel. Use an upgrade planner to modernize existing solar fields in place.
bitermotors-tandem-solar-array=A late 3 MW direct upgrade for a High-density Solar Panel. Ten times the generation in the same footprint makes a 10 GW terrestrial grid practical.
bitermotors-megapack=Stores 100 MJ and charges or discharges at up to 5 MW. Can be placed on the grid or sold through a Sales Office.
bitermotors-grid-megapack=Stores 1 GJ and charges or discharges at up to 50 MW. A direct late-game upgrade for the Megapack.
bitermotors-terrestrial-datacenter=Consumes 20 Dollars and a continuous 8 MW load to produce 20 AI Tokens every 30 seconds. Low power discards the current run.
bitermotors-orbital-datacenter-core=A 250 MW space-only AI factory. Every core requires eight Radiator Panels; low power or inadequate cooling scraps the active batch.
bitermotors-orbital-radiator-panel=Space-only cooling infrastructure. Eight panels provide cooling capacity for one Orbital Datacenter Core on the same platform.
bitermotors-high-density-space-solar-panel=A 50 MW space-only solar panel built for continuous orbital power.
bitermotors-planetary-grid-controller=A 10 GW final training facility. Any low-power condition discards all progress in its one-hour AGI Training Run.
bitermotors-prototype-roadster=Extremely fast and agile, but fragile, short-ranged, and nearly useless for cargo. Factory-new vehicles begin charged; park within 8 tiles of a powered Biter Motors charger to recharge.
bitermotors-premium-ev=A fast, refined black grand tourer with strong braking, good range, and moderate cargo capacity.
bitermotors-mass-market-ev=A forgiving white all-rounder with balanced speed, durability, range, and useful cargo space.
bitermotors-megatruck=A brutally fast, long-ranged silver Megatruck. Heavy steering, huge cargo capacity, and extreme collision durability make it a battering ram.
bitermotors-robotaxi-fleet=An efficient gold long-duty EV with excellent braking and range. Deploy it through a Robotaxi Service Center or drive it directly.
bitermotors-robotaxi-service-center=Holds 40 stacks of Robotaxis, serves five customers per vehicle, and draws up to 10 MW through built-in V4 fleet charging.
bitermotors-nickel-ore=Nickel-bearing ore for high-energy vehicle cells.
bitermotors-lithium-brine=A pumpjack resource refined into lithium carbonate for both battery chemistries.
bitermotors-cybertrain=An obscenely fast 1 GJ electric locomotive. It keeps accelerating toward roughly 970 km/h until schedule braking must begin. Heavy trains consume more acceleration energy; braking recovers up to 65%. Below 1% charge it retains an emergency reserve speed of roughly 17 km/h so it can limp to a charging stop.
bitermotors-cybertrain-charging-stop=Draws up to 50 MW while a Cybertrain is stopped here and shares that power among charging locomotives.

