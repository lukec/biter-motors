[item-description]
x-dollar=Roughly US$10,000 of investable capital in current-dollar terms. Produced by sales and spent on research, factories, energy, launch, and compute.
x-ev-reservation=Buyer paperwork printed by active charging stalls. Prototype, Premium, and Mass-market EV sales consume these.
x-gigafactory-module=One repeatable production cell containing capital, assemblers, labs, line logistics, and reinforced factory floor. Ten modules form one Gigafactory.
x-gigacast=Factory-scale casting machinery that replaces many separate body parts with a single large casting.
x-gigafactory-v2=A fast-replaceable Gigafactory upgrade built from one Gigafactory item, one Gigacast, and Dollars. It crafts twice as fast with 150% built-in productivity and substantially less energy per vehicle.
x-high-density-solar-array=Combines four conventional solar panels with high-density electronics and structure to produce 300 kW from one 4x4 footprint.
x-megapack=A factory-scale 100 MJ battery with 5 MW charge and discharge capacity.
x-ai-token=Physicalized compute output from terrestrial or orbital AI. Space compute scales the token stream; the planet decides how to use it.
x-agi-training-dataset=10,000 AI Tokens packaged as one physical input for the final training run.
x-capital-allocation=10,000 Dollars committed as one physical input for the final training run.
x-planetary-grid-segment=A verified segment of planet-scale energy infrastructure coordinated by AI, storage, satellites, and capital.
x-agi-model=The tangible result of the final training run. Producing it wins FactoryX.
x-prototype-roadster=Builds in 30 seconds. Sell one with an EV Reservation in 60 seconds for 2 Dollars of profit. Sell 50 to unlock Premium EV production.
x-premium-ev=Builds in 20 seconds. Sell one with an EV Reservation in 30 seconds for 1 Dollar of profit.
x-mass-market-ev=Builds in 8 seconds. Sell one with an EV Reservation in 5 seconds for 1 Dollar of profit.
x-cybertruck=Builds in 15 seconds. Sell one with an EV Reservation in 10 seconds for 2 Dollars of profit.
x-robotaxi-fleet=Builds in 20 seconds. Stack size 5. Each deployed Robotaxi can serve five nearby biter customers.
x-robotaxi-service-center=Stores up to 200 Robotaxis across 40 fleet slots and converts allocated fleet utilization into recurring profit.

