[technology-description]
x-industrial-supply-chain=Establishes terrestrial heavy industry before oil processing. Unlocks an electronic-circuit Electric Furnace and leads to Big Mining Drills, Foundries, and recycling.
x-sales-office=Unlocks the Sales Office, EV Charging Stations, and the first sales recipe: sell hopes and dreams. Place a powered charger near biter customers to unlock Prototype Roadsters.
x-premium-ev-program=Invests 250 cycles of red, green, blue science, and Dollars into production modules and EV components. Premium EV production also requires 50 completed Prototype Roadster sales.
x-ev-charging-network=Invests 300 cycles of red, green, blue science, and Dollars to unlock the eight-stall V2 charging network.
x-capital-scaling=Invests 1,000 cycles of red, green, blue, purple, yellow science, and Dollars into Gigacasting, Gigafactory V2, and V3 charging. Mass-market EVs require 250 Premium EV sales.
x-megatruck-engineering=Applies Tank engineering to a brutally fast, long-range electric truck. Production also requires 2,000 completed Mass-market EV sales.
x-energy-products=Invests 250 cycles through chemical science plus Dollars to unlock upgradeable High-density Solar Panels and Megapacks before factory-scale power demand arrives.
x-small-orbital-launch=Invests 1,000 cycles through utility science plus Dollars to begin launch services after the terrestrial Robotaxi economy.
x-reusable-launch=Invests 1,500 cycles through space science plus Dollars to reuse boosters and scale launch services.
x-satellite-constellation=Invests 2,000 cycles through space science plus Dollars in satellite buses and ground infrastructure.
x-terrestrial-ai=Unlocks Datacenter Racks, Autonomy Computers, and the Terrestrial Datacenter. Each cycle consumes 20 Dollars, draws 8 MW, and produces 20 AI Tokens every 30 seconds; stockpile 1,000 Tokens for Autonomous Logistics.
x-orbital-compute=Invests 2,000 cycles through electromagnetic and space science plus AI Tokens and Dollars to move compute onto space platforms.
x-autonomous-logistics=Unlocks V4 Superchargers and the Robotaxi Service Center. Robotaxi production additionally requires 5,000 total Roadster, Premium, Mass-market, and Megatruck sales.
x-planetary-energy-grid=Invests 2,500 cycles of all pre-Promethium science, AI Tokens, and Dollars in the 1 TW facility needed to train AGI.
x-supercharging-power-electronics=Higher-power charging electronics move more energy into player EVs while drawing proportionally more grid power.
x-long-range-battery=Improved battery management extends driving range and lets each customer charging stall support more EV owners.
x-premium-audio-systems=Biters love Nickelback.
x-customer-referral-program=Happy EV owners attract new customer settlements faster.
x-high-density-solar-productivity=Improved panel integration produces more High-density Solar Panels from the same panels, electronics, structure, and capital.
x-megapack-productivity=Improved pack assembly produces more FactoryX Megapacks from the same accumulators, electronics, structure, and capital.
x-battery-material-recovery=Separates battery chemistries and recovers 72 active cells from every ten damaged packs: exactly 90%, with no free electronics or pack hardware.
x-electric-semi-logistics=Unlocks the Cybertrain: an obscenely fast 6 MW electric locomotive whose heavy acceleration consumes real onboard energy, whose braking regenerates charge, and whose battery recharges only at powered Cybertrain charging stops.

[technology-effect-description]
x-supercharging-power-electronics=Player EV charging rate and charging power draw: +10% per level
x-long-range-battery=Driving energy use: -8% and customer EV capacity: +5% per level
x-premium-audio-systems=Consumer EV sale speed and Robotaxi revenue: +5% per level
x-customer-referral-program=Customer settlement growth: +10% per level
x-high-density-solar-productivity=High-density Solar Panel recipe productivity: +10% per level
x-megapack-productivity=Megapack recipe productivity: +10% per level
