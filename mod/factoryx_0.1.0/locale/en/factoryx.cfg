[entity-description]
x-sales-office=Converts physical products into dollars. Belt cars in, belt money out.
x-ev-charging-station=A four-stall charger serving 12 EVs per stall, or 48 EVs total. Active stalls draw 50 kW and print EV Reservations.
x-ev-charging-station-v2=An eight-stall hub serving 20 EVs per stall, or 160 EVs total. Each active stall draws 150 kW, for 1.2 MW maximum demand.
x-ev-charging-station-v3=A 12-stall Supercharger serving 32 EVs per stall, or 384 EVs total. Each active stall draws 250 kW, for 3 MW maximum demand.
x-ev-charging-station-v4=A solar-canopy, 20-stall Supercharger serving 50 EVs per stall, or 1,000 EVs total. Each active stall draws 500 kW, for 10 MW maximum demand.
x-gigafactory-building=A vast 20 MW vehicle factory with 4x crafting speed, 50% built-in productivity, and eight module slots. Every two Premium EV input sets produce three vehicles.
x-gigafactory-v2=A 30 MW upgrade with 8x crafting speed and 150% built-in productivity. It doubles V1 throughput while using less energy per unit of crafting speed.
x-high-density-solar-array=A 300 kW direct upgrade for a conventional solar panel. Use an upgrade planner to modernize existing solar fields in place.
x-megapack=Stores 100 MJ and charges or discharges at up to 5 MW. Can be placed on the grid or sold through a Sales Office.
x-terrestrial-datacenter=Consumes 20 Dollars and a continuous 8 MW load to produce 20 AI Tokens every 30 seconds. Low power discards the current run.
x-orbital-compute-array=Space-only compute infrastructure. Build it on platforms to produce AI Tokens at scale; low power discards the current run.
x-planetary-grid-controller=A 1 TW final training facility. Any low-power condition discards all progress in its one-hour AGI Training Run.
x-prototype-roadster=Extremely fast and agile, but fragile, short-ranged, and nearly useless for cargo. Factory-new vehicles begin charged; park within 8 tiles of a powered FactoryX charger to recharge.
x-premium-ev=A fast, refined black grand tourer with strong braking, good range, and moderate cargo capacity.
x-mass-market-ev=A forgiving white all-rounder with balanced speed, durability, range, and useful cargo space.
x-cybertruck=A brutally fast, long-ranged silver Megatruck. Heavy steering, huge cargo capacity, and extreme collision durability make it a battering ram.
x-robotaxi-fleet=An efficient gold long-duty EV with excellent braking and range. Deploy it through a Robotaxi Service Center or drive it directly.
x-robotaxi-service-center=Holds 40 stacks of Robotaxis, serves five customers per vehicle, and draws up to 10 MW through built-in V4 fleet charging.
x-nickel-ore=Nickel-bearing ore for high-energy vehicle cells.
x-lithium-brine=A pumpjack resource refined into lithium carbonate for both battery chemistries.
x-electric-semi=An obscenely fast 1 GJ electric locomotive. It keeps accelerating toward roughly 970 km/h until schedule braking must begin. Heavy trains consume more acceleration energy; braking recovers up to 65%. Below 1% charge it retains an emergency reserve speed of roughly 17 km/h so it can limp to a charging stop.
x-semi-charging-stop=Draws up to 50 MW while a Cybertrain is stopped here and shares that power among charging locomotives.

